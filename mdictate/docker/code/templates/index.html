<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mdictate</title>
  <style>
    :root {
      --bg: #1a1c1a;
      --bg-deep: #0c0e0c;
      --surface: #242724;
      --surface-2: #2a2d2a;
      --border: #3d4a3d;
      --border-bright: #5a7a5a;
      --text: #33ff66;
      --text-bright: #66ff99;
      --muted: #2a8f4a;
      --dim: #1e5c32;
      --accent: #33ff66;
      --accent-fill: #1a3d24;
      --record: #ff4444;
      --record-glow: rgba(255, 68, 68, 0.4);
      --ok: #33ff66;
      --warn: #c8ff33;
      --err: #ff6666;
      --glow: 0 0 8px rgba(51, 255, 102, 0.35);
      --radius: 2px;
      --sidebar-w: 300px;
      --font: "IBM Plex Mono", "Consolas", "Courier New", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      /* Soft phosphor vignette */
      background-image:
        radial-gradient(ellipse at center, #222522 0%, var(--bg) 70%, #0a0c0a 100%);
    }

    /* Subtle CRT scanlines */
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.12) 2px,
        rgba(0, 0, 0, 0.12) 4px
      );
      opacity: 0.45;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0.75rem 1rem 0.75rem;
      gap: 0.75rem;
    }

    .banner {
      display: none;
      flex-shrink: 0;
      background: var(--accent-fill);
      border: 1px solid var(--warn);
      color: var(--warn);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      text-shadow: var(--glow);
    }
    .banner.visible { display: block; }
    .banner code {
      background: var(--bg-deep);
      padding: 0.1rem 0.35rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.85em;
      color: var(--text-bright);
    }

    .main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr var(--sidebar-w);
      gap: 1rem;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
      overflow-y: auto;
    }

    .transcript-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      padding: 0.65rem 0.75rem;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.45), var(--glow);
    }

    /* Absolute-fill host: plain flex+textarea often keeps a narrow intrinsic
       wrap width (cols-based) while the panel itself looks full-width. */
    .buffer-host {
      position: relative;
      flex: 1 1 auto;
      min-height: 640px;
      min-width: 0;
      width: 100%;
    }

    header {
      flex-shrink: 0;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 0.15rem;
    }

    h1 {
      margin: 0 0 0.2rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-bright);
      text-shadow: var(--glow);
    }

    h1::before {
      content: "> ";
      color: var(--muted);
      text-shadow: none;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.75rem;
      margin: 0;
      letter-spacing: 0.04em;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 0.9rem;
      flex-shrink: 0;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.35rem;
    }

    .row {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.55rem 0.65rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-deep);
      color: var(--text);
      font-size: 0.8rem;
      font-family: var(--font);
      caret-color: var(--text-bright);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 0 0 0 1px var(--text), var(--glow);
    }

    input[type="text"]::placeholder {
      color: var(--dim);
    }

    button {
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: var(--font);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.55rem 0.75rem;
      background: var(--accent-fill);
      color: var(--text);
      transition: background 0.12s, color 0.12s, box-shadow 0.12s, border-color 0.12s;
    }

    button:hover:not(:disabled) {
      background: #234d2e;
      border-color: var(--text);
      color: var(--text-bright);
      box-shadow: var(--glow);
    }

    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--accent-fill);
      border-color: var(--border-bright);
    }

    .btn-primary {
      background: var(--accent-fill);
      color: var(--text-bright);
      border-color: var(--text);
      text-shadow: var(--glow);
    }
    .btn-primary:hover:not(:disabled) {
      background: #2a5c36;
    }

    .record-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 0.5rem 0.75rem;
    }

    .record-btn {
      width: 112px;
      height: 112px;
      border-radius: var(--radius);
      border: 2px solid var(--border-bright);
      background: var(--bg-deep);
      color: var(--text);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      box-shadow: inset 0 0 20px rgba(51, 255, 102, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .record-btn .icon {
      font-size: 0.7rem;
      line-height: 1;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    .record-btn:hover:not(:disabled) {
      border-color: var(--text);
      color: var(--text-bright);
      box-shadow: var(--glow), inset 0 0 24px rgba(51, 255, 102, 0.15);
    }

    .record-btn.recording {
      border-color: var(--record);
      color: var(--record);
      background: #2a1010;
      box-shadow: 0 0 0 2px var(--record-glow), 0 0 18px var(--record-glow);
      animation: pulse 1.1s steps(2, end) infinite;
    }

    .record-btn.recording .icon { color: var(--record); }

    .record-btn.busy {
      border-color: var(--warn);
      color: var(--warn);
      background: #222a10;
      box-shadow: 0 0 12px rgba(200, 255, 51, 0.25);
    }

    .record-btn.busy .icon { color: var(--warn); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .hint {
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .hint kbd {
      display: inline-block;
      padding: 0.05rem 0.35rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-bright);
      background: var(--bg-deep);
      font-size: 0.7rem;
      font-family: inherit;
      color: var(--text);
    }

    .status {
      min-height: 2.6em;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-word;
    }
    .status.ok { color: var(--ok); text-shadow: var(--glow); }
    .status.err { color: var(--err); }
    .status.warn { color: var(--warn); }
    .status.recording { color: var(--record); font-weight: 700; }

    .level-wrap {
      width: 100%;
      max-width: 200px;
      height: 8px;
      background: var(--bg-deep);
      border-radius: 0;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .level-bar {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        90deg,
        var(--text) 0 3px,
        transparent 3px 5px
      );
      box-shadow: var(--glow);
      transition: width 0.05s linear;
    }

    .transcript-panel > label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .transcript-meta {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .buffer-host textarea {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      min-width: 0;
      margin: 0;
      resize: none;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #080a08;
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1.55;
      font-family: var(--font);
      caret-color: var(--text-bright);
      text-shadow: 0 0 4px rgba(51, 255, 102, 0.25);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-wrap: break-word;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .buffer-host textarea::placeholder {
      color: var(--dim);
    }

    .buffer-host textarea::selection {
      background: var(--text);
      color: var(--bg-deep);
    }

    .buffer-host textarea:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 0 0 0 1px var(--dim), inset 0 0 30px rgba(51, 255, 102, 0.04);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .actions button { width: 100%; }

    .side-footer {
      margin-top: auto;
      padding-top: 0.5rem;
      color: var(--dim);
      font-size: 0.68rem;
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Scrollbars — terminal green */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border-bright) var(--bg-deep);
    }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: var(--bg-deep); }
    *::-webkit-scrollbar-thumb {
      background: var(--border);
      border: 1px solid var(--border-bright);
    }
    *::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* Stack on narrow screens / phones */
    @media (max-width: 820px) {
      .app {
        height: auto;
        min-height: 100%;
      }
      .main {
        grid-template-columns: 1fr;
        flex: none;
      }
      .sidebar {
        overflow: visible;
      }
      .buffer-host {
        min-height: 480px;
        flex: none;
        height: 480px;
      }
      .transcript-panel {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="banner" id="secureBanner" role="alert"></div>

    <div class="main">
      <section class="transcript-panel">
        <label for="transcript">
          <span>// buffer</span>
          <span class="transcript-meta" id="transcriptMeta">empty</span>
        </label>
        <div class="buffer-host">
          <textarea id="transcript" placeholder="awaiting input_"
                    rows="30" cols="120" wrap="soft" spellcheck="true"></textarea>
        </div>
      </section>

      <aside class="sidebar">
        <header>
          <h1>MDICTATE</h1>
          <p class="subtitle">LAN STT · whisper.cpp · clipboard</p>
        </header>

        <div class="card">
          <label for="whisperUrl">// whisper host</label>
          <div class="row">
            <input type="text" id="whisperUrl" spellcheck="false"
                   placeholder="http://localhost:8025"
                   value="{{ default_whisper_url }}">
            <button type="button" class="btn-secondary" id="saveUrlBtn" title="Save URL">Set</button>
          </div>
        </div>

        <div class="card record-area">
          <button type="button" class="record-btn" id="recordBtn" aria-pressed="false"
                  title="Hold to record (or hold Space)">
            <span class="icon" id="recordIcon">REC</span>
            <span id="recordLabel">HOLD</span>
          </button>
          <div class="level-wrap" aria-hidden="true"><div class="level-bar" id="levelBar"></div></div>
          <p class="hint">HOLD or <kbd>SPACE</kbd> · release to append</p>
          <div class="status" id="status">READY</div>
        </div>

        <div class="card actions">
          <button type="button" class="btn-primary" id="copyBtn">[ COPY ALL ]</button>
          <button type="button" class="btn-secondary" id="clearBtn">[ CLEAR ]</button>
        </div>

        <p class="side-footer">append mode · full buffer to clipboard</p>
      </aside>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "stt_whisper_url";
    const TARGET_RATE = 16000;
    // Desktop spark/marmot used a fixed 4× gain (quiet sounddevice, no AGC).
    // In the browser, autoGainControl already lifts levels — a blind 4× often
    // clips. Peak-normalize toward TARGET_PEAK instead, with MAX_GAIN as a
    // ceiling for very quiet sources only.
    const TARGET_PEAK = 0.8;
    const MAX_GAIN = 4.0;
    const MIN_PEAK_FOR_NORM = 0.01; // don't amplify near-silence into noise

    const whisperUrlEl = document.getElementById("whisperUrl");
    const saveUrlBtn = document.getElementById("saveUrlBtn");
    const recordBtn = document.getElementById("recordBtn");
    const recordLabel = document.getElementById("recordLabel");
    const recordIcon = document.getElementById("recordIcon");
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const transcriptMeta = document.getElementById("transcriptMeta");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const levelBar = document.getElementById("levelBar");

    let mediaStream = null;
    let audioCtx = null;
    let captureNode = null;   // AudioWorkletNode or ScriptProcessorNode fallback
    let silentGain = null;
    let sourceNode = null;
    let recording = false;
    let busy = false;
    let samples = [];
    let spaceHeld = false;

    const WORKLET_SOURCE = `
class SttCaptureProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch && ch.length) {
      // Copy — the underlying buffer is reused by the audio engine
      this.port.postMessage(ch.slice(0));
    }
    return true;
  }
}
registerProcessor('stt-capture', SttCaptureProcessor);
`;

    async function loadCaptureWorklet(ctx) {
      const blob = new Blob([WORKLET_SOURCE], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);
      try {
        await ctx.audioWorklet.addModule(url);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function onCaptureSamples(float32) {
      if (!recording) return;
      samples.push(float32 instanceof Float32Array ? float32 : new Float32Array(float32));
      const peak = peakOf(samples[samples.length - 1]);
      levelBar.style.width = Math.min(100, peak * 100) + "%";
    }

    // Restore saved whisper URL
    (function initUrl() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) whisperUrlEl.value = saved;
    })();

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function updateTranscriptMeta() {
      const n = transcriptEl.value.length;
      if (!n) {
        transcriptMeta.textContent = "0 bytes · append mode";
        return;
      }
      const words = transcriptEl.value.trim().split(/\s+/).filter(Boolean).length;
      transcriptMeta.textContent = words + " words · " + n + " bytes";
    }

    function normalizeWhisperText(raw) {
      // whisper.cpp often inserts newlines between sentences/segments.
      // Collapse those so each recording is one flowing paragraph; we only
      // add blank lines ourselves between separate recordings.
      return String(raw || "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .replace(/\n+/g, " ")
        .replace(/[ \t\u00a0]+/g, " ")
        .trim();
    }

    function appendTranscript(chunk) {
      const text = normalizeWhisperText(chunk);
      if (!text) return;
      const existing = transcriptEl.value;
      if (!existing.trim()) {
        transcriptEl.value = text;
      } else {
        // Separate each recording with a blank line.
        transcriptEl.value = existing.replace(/\s+$/, "") + "\n\n" + text;
      }
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      updateTranscriptMeta();
    }

    function normalizeWhisperUrl(raw) {
      let u = (raw || "").trim();
      if (!u) u = "{{ default_whisper_url }}";
      if (!/^https?:\/\//i.test(u)) u = "http://" + u;
      return u.replace(/\/+$/, "");
    }

    function saveUrl() {
      const u = normalizeWhisperUrl(whisperUrlEl.value);
      whisperUrlEl.value = u;
      localStorage.setItem(STORAGE_KEY, u);
      setStatus("Saved whisper URL: " + u, "ok");
    }

    saveUrlBtn.addEventListener("click", saveUrl);
    whisperUrlEl.addEventListener("change", saveUrl);

    function micUnavailableReason() {
      // Chrome/Firefox only expose getUserMedia in a secure context
      // (https://, or http://localhost / http://127.0.0.1).
      const host = location.hostname;
      const isLocalHost =
        host === "localhost" ||
        host === "127.0.0.1" ||
        host === "[::1]" ||
        host.endsWith(".localhost");
      if (!window.isSecureContext && !isLocalHost) {
        return (
          "Microphone blocked: this page is not a secure context. " +
          "For LAN use open https://" + host + ":" + (location.port || "8090") +
          "/ (server enables HTTPS by default). Accept the cert warning once."
        );
      }
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
        return (
          "Microphone API unavailable (navigator.mediaDevices is missing). " +
          "Use https:// on the LAN IP (default) or http://localhost on the server machine."
        );
      }
      return null;
    }

    async function ensureMic() {
      if (mediaStream) return mediaStream;

      const reason = micUnavailableReason();
      if (reason) {
        throw new Error(reason);
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });
      return mediaStream;
    }

    // Warn early if mic cannot work in this origin
    (function checkSecureContext() {
      const reason = micUnavailableReason();
      if (!reason) return;
      const banner = document.getElementById("secureBanner");
      const port = location.port || "8090";
      const host = location.hostname;
      banner.innerHTML =
        "<strong>Microphone unavailable on this origin.</strong> " +
        "Browsers only allow mic access on <code>https://</code> or localhost. " +
        "You are on <code>" + location.origin + "</code>. " +
        "For LAN: run <code>./start.sh</code> (HTTPS is on by default) and open " +
        "<code>https://" + host + ":" + port + "/</code> — accept the self-signed cert " +
        "(Advanced → Proceed). On the server machine you can also use " +
        "<code>http://127.0.0.1:" + port + "/</code> with <code>STT_SSL=0</code>.";
      banner.classList.add("visible");
      setStatus("Mic blocked — see yellow notice above", "err");
    })();

    function downsample(float32, fromRate, toRate) {
      if (fromRate === toRate) return float32;
      const ratio = fromRate / toRate;
      const newLen = Math.round(float32.length / ratio);
      const result = new Float32Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const idx = i * ratio;
        const i0 = Math.floor(idx);
        const i1 = Math.min(i0 + 1, float32.length - 1);
        const frac = idx - i0;
        result[i] = float32[i0] * (1 - frac) + float32[i1] * frac;
      }
      return result;
    }

    function peakOf(float32) {
      let peak = 0;
      for (let i = 0; i < float32.length; i++) {
        const a = Math.abs(float32[i]);
        if (a > peak) peak = a;
      }
      return peak;
    }

    function normalizeGain(float32) {
      const peak = peakOf(float32);
      if (peak < MIN_PEAK_FOR_NORM) return 1.0;
      // Scale so peak → TARGET_PEAK, but never boost more than MAX_GAIN
      // and never attenuate below 1 if already under target (only reduce if hot).
      const needed = TARGET_PEAK / peak;
      if (needed >= 1) return Math.min(needed, MAX_GAIN);
      // Hot signal (e.g. AGC already full-scale): pull down to leave headroom
      return needed;
    }

    function encodeWav(float32, sampleRate) {
      // Peak-normalize + convert to 16-bit PCM WAV
      const n = float32.length;
      const gain = normalizeGain(float32);
      const buffer = new ArrayBuffer(44 + n * 2);
      const view = new DataView(buffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + n * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, n * 2, true);

      let offset = 44;
      for (let i = 0; i < n; i++) {
        let s = Math.max(-1, Math.min(1, float32[i] * gain));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        offset += 2;
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function padSilence(float32, sampleRate, seconds) {
      const pad = Math.floor(sampleRate * seconds);
      const out = new Float32Array(float32.length + pad * 2);
      out.set(float32, pad);
      return out;
    }

    async function startRecording() {
      if (recording || busy) return;
      try {
        const stream = await ensureMic();
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }
        sourceNode = audioCtx.createMediaStreamSource(stream);
        samples = [];
        recording = true;

        // Prefer AudioWorklet (ScriptProcessorNode is deprecated).
        // Mute into destination so the graph runs without speaker feedback.
        silentGain = audioCtx.createGain();
        silentGain.gain.value = 0;

        if (audioCtx.audioWorklet) {
          await loadCaptureWorklet(audioCtx);
          captureNode = new AudioWorkletNode(audioCtx, "stt-capture", {
            numberOfInputs: 1,
            numberOfOutputs: 1,
            channelCount: 1,
          });
          captureNode.port.onmessage = (e) => onCaptureSamples(e.data);
          sourceNode.connect(captureNode);
          captureNode.connect(silentGain);
        } else {
          // Legacy fallback
          const bufferSize = 4096;
          captureNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
          captureNode.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            onCaptureSamples(new Float32Array(input));
          };
          sourceNode.connect(captureNode);
          captureNode.connect(silentGain);
        }
        silentGain.connect(audioCtx.destination);

        recordBtn.classList.add("recording");
        recordBtn.setAttribute("aria-pressed", "true");
        recordLabel.textContent = "REC";
        recordIcon.textContent = "●";
        setStatus("RECORDING… release to append", "recording");
      } catch (err) {
        console.error(err);
        recording = false;
        setStatus("MIC ERROR: " + err.message, "err");
        resetRecordUi();
      }
    }

    async function stopRecording() {
      if (!recording) return;
      recording = false;

      try {
        if (captureNode) {
          try { captureNode.port && (captureNode.port.onmessage = null); } catch (_) {}
          try { captureNode.onaudioprocess = null; } catch (_) {}
          captureNode.disconnect();
          captureNode = null;
        }
        if (silentGain) {
          silentGain.disconnect();
          silentGain = null;
        }
        if (sourceNode) {
          sourceNode.disconnect();
          sourceNode = null;
        }
        const rate = audioCtx ? audioCtx.sampleRate : TARGET_RATE;
        if (audioCtx) {
          await audioCtx.close().catch(() => {});
          audioCtx = null;
        }
        levelBar.style.width = "0%";

        recordBtn.classList.remove("recording");
        recordBtn.setAttribute("aria-pressed", "false");

        if (!samples.length) {
          recordLabel.textContent = "HOLD";
          recordIcon.textContent = "REC";
          setStatus("NO AUDIO CAPTURED", "warn");
          return;
        }

        // Concatenate + downsample to 16 kHz mono
        let total = 0;
        for (const chunk of samples) total += chunk.length;
        const merged = new Float32Array(total);
        let off = 0;
        for (const chunk of samples) {
          merged.set(chunk, off);
          off += chunk.length;
        }
        samples = [];

        const down = downsample(merged, rate, TARGET_RATE);
        const padded = padSilence(down, TARGET_RATE, 0.5);
        const wavBlob = encodeWav(padded, TARGET_RATE);

        await sendForTranscription(wavBlob);
      } catch (err) {
        console.error(err);
        setStatus("Error finishing recording: " + err.message, "err");
        resetRecordUi();
      }
    }

    function resetRecordUi() {
      busy = false;
      recordBtn.classList.remove("recording", "busy");
      recordBtn.disabled = false;
      recordLabel.textContent = "HOLD";
      recordIcon.textContent = "REC";
    }

    async function sendForTranscription(wavBlob) {
      busy = true;
      recordBtn.classList.add("busy");
      recordBtn.disabled = true;
      recordLabel.textContent = "...";
      recordIcon.textContent = "WAIT";
      setStatus("TRANSCRIBING…", "warn");

      const whisperUrl = normalizeWhisperUrl(whisperUrlEl.value);
      whisperUrlEl.value = whisperUrl;
      localStorage.setItem(STORAGE_KEY, whisperUrl);

      const form = new FormData();
      form.append("file", wavBlob, "recording.wav");
      form.append("whisper_url", whisperUrl);

      try {
        const resp = await fetch("/api/transcribe", { method: "POST", body: form });
        const data = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          const msg = data.error || ("HTTP " + resp.status);
          const detail = data.detail ? " — " + data.detail : "";
          setStatus(msg + detail, "err");
          resetRecordUi();
          return;
        }

        const text = (data.text || "").trim();

        if (!text) {
          setStatus("EMPTY RESULT — speak louder/longer", "warn");
        } else {
          appendTranscript(text);
          const full = transcriptEl.value;
          const copied = await copyText(full);
          setStatus(
            copied
              ? "OK — appended · buffer copied"
              : "OK — appended · copy failed (use COPY ALL)",
            copied ? "ok" : "warn"
          );
        }
      } catch (err) {
        console.error(err);
        setStatus("REQUEST FAILED: " + err.message, "err");
      } finally {
        resetRecordUi();
      }
    }

    async function copyText(text) {
      if (!text) return false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* fall through */ }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (_) {
        return false;
      }
    }

    // Pointer (mouse / touch) hold-to-record
    recordBtn.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      recordBtn.setPointerCapture(e.pointerId);
      startRecording();
    });
    recordBtn.addEventListener("pointerup", (e) => {
      e.preventDefault();
      stopRecording();
    });
    recordBtn.addEventListener("pointercancel", () => stopRecording());
    recordBtn.addEventListener("lostpointercapture", () => {
      if (recording) stopRecording();
    });
    // Prevent context menu on long-press
    recordBtn.addEventListener("contextmenu", (e) => e.preventDefault());

    // Spacebar hold-to-record (ignore when typing in inputs)
    function isTypingTarget(el) {
      if (!el) return false;
      const tag = el.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || el.isContentEditable;
    }

    window.addEventListener("keydown", (e) => {
      if (e.code !== "Space" && e.key !== " ") return;
      if (isTypingTarget(e.target)) return;
      if (e.repeat) return;
      e.preventDefault();
      spaceHeld = true;
      startRecording();
    });
    window.addEventListener("keyup", (e) => {
      if (e.code !== "Space" && e.key !== " ") return;
      if (!spaceHeld) return;
      e.preventDefault();
      spaceHeld = false;
      stopRecording();
    });
    window.addEventListener("blur", () => {
      if (spaceHeld || recording) {
        spaceHeld = false;
        stopRecording();
      }
    });

    copyBtn.addEventListener("click", async () => {
      const text = transcriptEl.value;
      if (!text) {
        setStatus("BUFFER EMPTY", "warn");
        return;
      }
      const ok = await copyText(text);
      setStatus(ok ? "BUFFER COPIED" : "CLIPBOARD ERROR", ok ? "ok" : "err");
    });

    clearBtn.addEventListener("click", () => {
      transcriptEl.value = "";
      updateTranscriptMeta();
      setStatus("BUFFER CLEARED", "");
    });

    transcriptEl.addEventListener("input", updateTranscriptMeta);
    updateTranscriptMeta();
  </script>
</body>
</html>
