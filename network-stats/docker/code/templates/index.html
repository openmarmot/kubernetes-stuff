<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Stats</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
        }
        .windows {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .window {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .window-label {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .window-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #00d4ff;
        }
        .window-value.good { color: #00ff88; }
        .window-value.warn { color: #ffaa00; }
        .window-value.bad { color: #ff6b6b; }
        .window-meta {
            font-size: 0.75em;
            color: #666;
            margin-top: 5px;
        }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            margin-bottom: 15px;
            color: #00d4ff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9em;
        }
        th { color: #00d4ff; }
        .success { color: #00ff88; }
        .failed { color: #ff6b6b; }
        .actions { text-align: center; margin-bottom: 20px; }
        .btn {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #00b8d4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Network Stats</h1>

        <div class="actions">
            <button class="btn" onclick="refreshData()">Refresh</button>
            <button class="btn" onclick="triggerPing()">Ping Now</button>
        </div>

        <div class="windows" id="windows"></div>

        <div class="section">
            <h2>Recent Checks</h2>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Avg (ms)</th>
                        <th>Min / Max</th>
                    </tr>
                </thead>
                <tbody id="ping-data"></tbody>
            </table>
        </div>
    </div>

    <script>
        function getStatusClass(packetLoss) {
            if (packetLoss === null) return '';
            if (packetLoss === 0) return 'good';
            if (packetLoss < 5) return 'warn';
            return 'bad';
        }

        function formatValue(window) {
            if (window.count === 0) return { loss: 'N/A', latency: 'N/A', cls: '' };
            if (window.packet_loss === 100) return { loss: '100%', latency: 'N/A', cls: 'bad' };
            const lossCls = getStatusClass(window.packet_loss);
            return { loss: window.packet_loss + '%', latency: window.avg_ms + ' ms', cls: lossCls };
        }

        function refreshData() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(json => {
                    if (json.message) return;

                    const windowsDiv = document.getElementById('windows');
                    windowsDiv.innerHTML = '';
                    const labels = {'5m': '5 min', '15m': '15 min', '30m': '30 min', '1h': '1 hour', '2h': '2 hours'};
                    for (const [key, label] of Object.entries(labels)) {
                        const w = json.windows[key];
                        const formatted = formatValue(w);
                        const meta = w.count > 0 ? `${w.count} checks` : '';
                        windowsDiv.innerHTML += `
                            <div class="window">
                                <div class="window-label">${label}</div>
                                <div class="window-value ${formatted.cls}">${formatted.loss}</div>
                                <div class="window-value" style="font-size:1em;color:#aaa;">${formatted.latency}</div>
                                <div class="window-meta">${meta}</div>
                            </div>
                        `;
                    }

                    const tbody = document.getElementById('ping-data');
                    tbody.innerHTML = '';
                    (json.recent || []).forEach(row => {
                        const date = new Date(row.timestamp);
                        const time = date.toLocaleTimeString();
                        const latency = row.success ? row.avg_ms.toFixed(2) : 'N/A';
                        const minmax = row.success ? `${row.min_ms.toFixed(2)} / ${row.max_ms.toFixed(2)}` : 'N/A';
                        tbody.innerHTML += `
                            <tr>
                                <td>${time}</td>
                                <td class="${row.success ? 'success' : 'failed'}">${row.success ? 'OK' : 'FAIL'}</td>
                                <td>${latency}</td>
                                <td>${minmax}</td>
                            </tr>
                        `;
                    });
                });
        }

        function triggerPing() {
            fetch('/api/ping_now', { method: 'POST' })
                .then(() => refreshData());
        }

        refreshData();
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
